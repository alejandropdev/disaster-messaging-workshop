services:
  wildfly:
    build: .
    container_name: dm-tiers
    ports: ["8080:8080"]
    depends_on: [mailhog]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/disasters || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: dm-mailhog
    ports: ["8025:8025"]
