apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: disaster
spec:
  replicas: 1
  selector:
    matchLabels: { app: rabbitmq }
  template:
    metadata:
      labels: { app: rabbitmq }
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management
          ports:
            - { name: amqp, containerPort: 5672 }
            - { name: ui, containerPort: 15672 }
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: disaster
spec:
  selector: { app: rabbitmq }
  ports:
    - { name: amqp, port: 5672 }
    - { name: ui, port: 15672 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailhog
  namespace: disaster
spec:
  replicas: 1
  selector:
    matchLabels: { app: mailhog }
  template:
    metadata:
      labels: { app: mailhog }
    spec:
      containers:
        - name: mailhog
          image: mailhog/mailhog:v1.0.1
          ports:
            - { name: smtp, containerPort: 1025 }
            - { name: ui, containerPort: 8025 }
---
apiVersion: v1
kind: Service
metadata:
  name: mailhog
  namespace: disaster
spec:
  type: NodePort
  selector: { app: mailhog }
  ports:
    - { name: smtp, port: 1025 }
    - { name: ui, port: 8025, nodePort: 30025 }
