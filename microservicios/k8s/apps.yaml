apiVersion: v1
kind: ConfigMap
metadata:
  name: dm-config
  namespace: disaster
data:
  RABBITMQ_HOST: rabbitmq
  SMTP_HOST: mailhog
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: intake
  namespace: disaster
spec:
  replicas: 1
  selector:
    matchLabels: { app: intake }
  template:
    metadata:
      labels: { app: intake }
    spec:
      containers:
        - name: intake
          image: dm-intake:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: dm-config
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: intake
  namespace: disaster
spec:
  type: NodePort
  selector: { app: intake }
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30081
---
apiVersion: apps/v1
