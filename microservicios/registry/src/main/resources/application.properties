mp.messaging.connector.smallrye-rabbitmq.host=${RABBITMQ_HOST:localhost}
mp.messaging.connector.smallrye-rabbitmq.port=5672
mp.messaging.connector.smallrye-rabbitmq.username=guest
mp.messaging.connector.smallrye-rabbitmq.password=guest

mp.messaging.incoming.received.connector=smallrye-rabbitmq
mp.messaging.incoming.received.exchange.name=disaster.events
mp.messaging.incoming.received.exchange.type=topic
mp.messaging.incoming.received.queue.name=registry.received
mp.messaging.incoming.received.routing-keys=received

mp.messaging.outgoing.registered.connector=smallrye-rabbitmq
mp.messaging.outgoing.registered.exchange.name=disaster.events
mp.messaging.outgoing.registered.exchange.type=topic
mp.messaging.outgoing.registered.default-routing-key=registered

quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:registry;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.database.generation=drop-and-create
